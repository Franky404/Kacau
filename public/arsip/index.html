<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101114">
  <title>Galeri Foto - Kacau</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body { margin:0; font-family:Arial,Helvetica,sans-serif; background:#101114; color:#f5f5f7; }
    header { position:sticky; top:0; z-index:2; padding:20px 16px 15px; background:#1b1c22; border-bottom:1px solid #30313a; }
    h1 { font-size:25px; margin:0 0 15px; }
    #cari { width:100%; padding:13px 15px; border:1px solid #444650; border-radius:12px; background:#292a30; color:white; font-size:16px; outline:none; }
    #cari:focus { border-color:#8b8dff; }
    #jumlah { color:#aaa; font-size:13px; margin-top:9px; }
    #galeri { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; padding:12px; }
    .kartu { min-width:0; padding:0; overflow:hidden; border-radius:12px; border:1px solid #30313a; background:#22242a; color:inherit; text-align:left; cursor:pointer; }
    .kartu img { display:block; width:100%; height:175px; object-fit:cover; background:#292a30; }
    .nama { padding:10px; font-size:13px; line-height:1.4; overflow-wrap:anywhere; }
    .pesan { grid-column:1/-1; padding:28px 12px; text-align:center; color:#b5b5bd; line-height:1.6; }
    #viewer { display:none; position:fixed; inset:0; z-index:5; padding:14px; background:rgba(0,0,0,.96); align-items:center; justify-content:center; flex-direction:column; }
    #fotoBesar { max-width:100%; max-height:76vh; object-fit:contain; }
    #namaBesar { margin:12px 0; text-align:center; overflow-wrap:anywhere; }
    .aksi { display:flex; gap:8px; justify-content:center; flex-wrap:wrap; }
    .aksi button { border:0; border-radius:9px; padding:11px 15px; font-size:15px; cursor:pointer; }
    #unduh { background:#f5f5f7; color:#111; }
    #tutup { background:#d94343; color:white; }
    @media (min-width:700px) { #galeri { grid-template-columns:repeat(4,minmax(0,1fr)); gap:14px; padding:18px; } .kartu img { height:220px; } header { padding-left:22px; padding-right:22px; } }
  </style>
</head>
<body>
  <header>
    <h1>📷 Galeri Foto Kacau</h1>
    <input id="cari" type="search" placeholder="Cari nama foto..." autocomplete="off" aria-label="Cari nama foto">
    <div id="jumlah"></div>
  </header>
  <main id="galeri" aria-live="polite"></main>

  <div id="viewer" role="dialog" aria-modal="true" aria-label="Penampil foto">
    <img id="fotoBesar" alt="Foto yang dipilih">
    <div id="namaBesar"></div>
    <div class="aksi">
      <button id="unduh" type="button">⬇ Unduh Foto</button>
      <button id="tutup" type="button">✕ Tutup</button>
    </div>
  </div>

  <script>
    // Otomatis membaca semua gambar dari folder public/arsip di GitHub.
    // Tambahkan foto ke folder itu lalu Commit changes; tidak perlu edit HTML.
    const PEMILIK_GITHUB = "Franky404";
    const NAMA_REPO = "Kacau";
    const FOLDER_FOTO = "public/arsip";
    let daftarFoto = [];
    const CACHE_KEY = "kacau_galeri_daftar_v2";
    const CACHE_TTL = 5 * 60 * 1000;

    const galeri = document.getElementById("galeri");
    const cari = document.getElementById("cari");
    const jumlah = document.getElementById("jumlah");
    const viewer = document.getElementById("viewer");
    const fotoBesar = document.getElementById("fotoBesar");
    const namaBesar = document.getElementById("namaBesar");
    let fotoAktif = "";

    function namaDariUrl(url) {
      try { return decodeURIComponent(url.split("/").pop().split("?")[0]); }
      catch { return url.split("/").pop(); }
    }

    function buatUrlFoto(nama) {
      // Gunakan GitHub raw agar foto baru dapat tampil setelah di-commit,
      // tanpa harus menunggu Vercel selesai membangun ulang situs.
      return `https://raw.githubusercontent.com/${PEMILIK_GITHUB}/${NAMA_REPO}/main/${FOLDER_FOTO}/${encodeURIComponent(nama).replace(/%2F/g, "/")}`;
    }

    function bacaCache() {
      try {
        const data = JSON.parse(localStorage.getItem(CACHE_KEY) || "null");
        if (data && Array.isArray(data.foto)) {
          daftarFoto = data.foto;
          tampilkanFoto();
          jumlah.textContent = `${daftarFoto.length} foto · dari cache`;
          return data;
        }
      } catch (_) {}
      return null;
    }

    async function muatDaftarFoto() {
      // Tampilkan hasil sebelumnya segera, sambil memperbarui daftar di latar belakang.
      const cache = bacaCache();
      if (!cache) {
        galeri.replaceChildren();
        const loading = document.createElement("div");
        loading.className = "pesan";
        loading.textContent = "Memuat daftar foto…";
        galeri.appendChild(loading);
        jumlah.textContent = "Sedang memuat foto…";
      }

      try {
        const api = `https://api.github.com/repos/${PEMILIK_GITHUB}/${NAMA_REPO}/contents/${FOLDER_FOTO}`;
        const response = await fetch(api, {
          headers: { "Accept": "application/vnd.github+json" },
          cache: "no-store"
        });
        if (!response.ok) throw new Error(response.status === 404 ? "Folder foto tidak ditemukan atau repositori tidak publik." : `GitHub memberi respons ${response.status}.`);
        const files = await response.json();
        const fotoBaru = files
          .filter(file => file.type === "file" && /\.(jpe?g|png|gif|webp|avif|bmp)$/i.test(file.name))
          .map(file => buatUrlFoto(file.name));

        const berubah = JSON.stringify(fotoBaru) !== JSON.stringify(daftarFoto);
        daftarFoto = fotoBaru;
        try { localStorage.setItem(CACHE_KEY, JSON.stringify({ waktu: Date.now(), foto: daftarFoto })); } catch (_) {}
        if (berubah || !cache) tampilkanFoto();
        jumlah.textContent = `${daftarFoto.length} foto`;
        if (!daftarFoto.length) {
          galeri.replaceChildren();
          const pesan = document.createElement("div");
          pesan.className = "pesan";
          pesan.textContent = "Belum ada foto. Upload JPG, PNG, WEBP, atau gambar lain ke public/arsip di GitHub, lalu Commit changes.";
          galeri.appendChild(pesan);
        }
      } catch (error) {
        if (cache) {
          jumlah.textContent = `${daftarFoto.length} foto · cache offline`;
        } else {
          jumlah.textContent = "Foto gagal dimuat";
          galeri.replaceChildren();
          const pesan = document.createElement("div");
          pesan.className = "pesan";
          pesan.textContent = "Tidak bisa membaca daftar foto dari GitHub. Pastikan repositori Franky404/Kacau publik dan folder public/arsip tersedia. Detail: " + error.message;
          galeri.appendChild(pesan);
        }
      }
    }

    function tampilkanFoto() {
      const kata = cari.value.trim().toLowerCase();
      const hasil = daftarFoto.filter(url => namaDariUrl(url).toLowerCase().includes(kata));
      galeri.replaceChildren();
      jumlah.textContent = `${hasil.length} foto`;

      if (!hasil.length) {
        const pesan = document.createElement("div");
        pesan.className = "pesan";
        pesan.textContent = "Foto tidak ditemukan.";
        galeri.appendChild(pesan);
        return;
      }

      hasil.forEach(url => {
        const nama = namaDariUrl(url);
        const kartu = document.createElement("button");
        kartu.type = "button";
        kartu.className = "kartu";

        const img = document.createElement("img");
        img.src = url;
        img.alt = nama;
        img.loading = "lazy";
        img.onerror = () => {
          img.removeAttribute("src");
          img.alt = "Foto tidak ditemukan";
          img.style.objectFit = "contain";
          const fallback = document.createElement("div");
          fallback.className = "pesan";
          fallback.textContent = "Foto tidak ditemukan. Periksa nama dan lokasi file JPG.";
          kartu.replaceChildren(fallback);
          kartu.disabled = true;
          kartu.style.cursor = "default";
        };

        const label = document.createElement("div");
        label.className = "nama";
        label.textContent = nama;
        kartu.append(img, label);
        kartu.addEventListener("click", () => bukaFoto(url, nama));
        galeri.appendChild(kartu);
      });
    }

    function bukaFoto(url, nama) {
      fotoAktif = url;
      fotoBesar.src = url;
      fotoBesar.alt = nama;
      namaBesar.textContent = nama;
      viewer.style.display = "flex";
    }
    function tutupViewer() {
      viewer.style.display = "none";
      fotoBesar.removeAttribute("src");
    }
    document.getElementById("tutup").addEventListener("click", tutupViewer);
    viewer.addEventListener("click", e => { if (e.target === viewer) tutupViewer(); });
    document.addEventListener("keydown", e => { if (e.key === "Escape") tutupViewer(); });
    document.getElementById("unduh").addEventListener("click", () => {
      if (!fotoAktif) return;
      const a = document.createElement("a");
      a.href = fotoAktif;
      a.download = namaDariUrl(fotoAktif);
      document.body.appendChild(a);
      a.click();
      a.remove();
    });
    cari.addEventListener("input", tampilkanFoto);
    // Tombol/gesture refresh dapat memperbarui daftar foto lebih cepat.
    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "visible") muatDaftarFoto();
    });
    muatDaftarFoto();
  </script>
</body>
</html>
